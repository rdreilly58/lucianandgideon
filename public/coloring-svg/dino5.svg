  <path d="M 330 170 L 360 175 L 355 185 L 330 180 Z" stroke-width="2.5"/>
  <line x1="340" y1="176" x2="340" y2="182" stroke-width="2"/>
  <line x1="345" y1="177" x2="345" y2="183" stroke-width="2"/>
  <line x1="350" y1="178" x2="350" y2="183" stroke-width="2"/>
  <!-- Small arms -->
  <path d="M 280" y1="185" L 295 205 L 293 213" stroke-width="3"/>
  <line x1="293" y1="213" x2="288" y2="217" stroke-width="2"/>
  <line x1="293" y1="213" x2="298" y2="217" stroke-width="2"/>
  <!-- Running legs -->
