<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" fill="none" stroke="black" stroke-width="2.5">
  <!-- Construction Robot -->
  <rect x="200" y="50" width="100" height="70" rx="8" stroke-width="3"/>
  <rect x="220" y="70" width="25" height="20" rx="3"/>
  <rect x="255" y="70" width="25" height="20" rx="3"/>
  <rect x="220" y="100" width="60" height="10" rx="2"/>
  <!-- Hard hat antenna -->
  <polygon points="235,50 250,30 265,50" stroke-width="3"/>
  <circle cx="250" cy="25" r="5"/>
  <!-- Body with tools -->
  <rect x="190" y="120" width="120" height="90" rx="8" stroke-width="3"/>
  <rect x="210" y="140" width="80" height="20" rx="3"/>
  <circle cx="230" cy="175" r="12"/>
  <circle cx="270" cy="175" r="12"/>
  <!-- Drill arm -->
  <rect x="120" y="145" width="65" height="20" rx="5" stroke-width="3"/>
  <polygon points="120,155 95,145 95,165" stroke-width="2"/>
  <circle cx="98" cy="155" r="8"/>
  <line x1="92" y1="155" x2="104" y2="155" stroke-width="2"/>
  <!-- Claw arm -->
  <rect x="315" y="145" width="65" height="20" rx="5" stroke-width="3"/>
  <path d="M 380 145 L 395 135 L 400 145" stroke-width="3"/>
  <path d="M 380 165 L 395 175 L 400 165" stroke-width="3"/>
  <!-- Treads -->
  <rect x="180" y="210" width="140" height="50" rx="25" stroke-width="4"/>
  <circle cx="200" cy="235" r="15"/>
  <circle cx="250" cy="235" r="15"/>
  <circle cx="300" cy="235" r="15"/>
</svg>
