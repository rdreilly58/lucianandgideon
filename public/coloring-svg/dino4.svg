<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" fill="none" stroke="black" stroke-width="2.5">
  <!-- Long-neck Brachiosaurus -->
  <ellipse cx="200" cy="280" rx="80" ry="55" stroke-width="3"/>
  <!-- Long neck going up -->
  <rect x="255" y="160" width="30" height="130" rx="8" stroke-width="3"/>
  <!-- Head at top -->
  <ellipse cx="270" cy="140" rx="30" ry="25" stroke-width="3"/>
  <circle cx="280" cy="135" r="6"/>
  <circle cx="282" cy="133" r="3" fill="black"/>
  <path d="M 290 145 Q 295 147, 300 145" stroke-width="2"/>
  <!-- Nostril -->
  <ellipse cx="285" cy="130" rx="3" ry="2"/>
  <!-- Front legs (long) -->
  <rect x="235" y="310" width="22" height="80" rx="5" stroke-width="3"/>
  <rect x="270" y="310" width="22" height="80" rx="5" stroke-width="3"/>
  <!-- Back legs (shorter) -->
  <rect x="160" y="315" width="20" height="60" rx="5" stroke-width="3"/>
  <rect x="195" y="315" width="20" height="60" rx="5" stroke-width="3"/>
  <!-- Tail -->
  <path d="M 130 270 Q 80 260, 50 240" stroke-width="4"/>
  <!-- Spots on body -->
  <circle cx="180" cy="265" r="8"/>
  <circle cx="210" cy="275" r="10"/>
  <circle cx="190" cy="295" r="7"/>
</svg>
