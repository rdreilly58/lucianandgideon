<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none" stroke="black" stroke-width="3">
  <!-- T-Rex Body -->
  <ellipse cx="200" cy="180" rx="80" ry="60"/>
  <!-- Head -->
  <ellipse cx="280" cy="140" rx="40" ry="35"/>
  <!-- Jaw -->
  <path d="M 280 160 L 320 170 L 310 180 L 280 175 Z"/>
  <!-- Eye -->
  <circle cx="290" cy="135" r="5" fill="black"/>
  <!-- Teeth -->
  <line x1="295" y1="170" x2="295" y2="177"/>
  <line x1="300" y1="172" x2="300" y2="179"/>
  <line x1="305" y1="174" x2="305" y2="180"/>
  <!-- Arm (small!) -->
  <line x1="230" y1="160" x2="250" y2="170"/>
  <line x1="250" y1="170" x2="245" y2="175"/>
  <!-- Legs -->
  <line x1="180" y1="220" x2="160" y2="260"/>
  <line x1="160" y1="260" x2="150" y2="260"/>
  <line x1="160" y1="260" x2="170" y2="260"/>
  <line x1="220" y1="220" x2="240" y2="260"/>
  <line x1="240" y1="260" x2="230" y2="260"/>
  <line x1="240" y1="260" x2="250" y2="260"/>
  <!-- Tail -->
  <path d="M 140 170 Q 80 160, 60 140" stroke-width="3"/>
  <!-- Back Spikes -->
  <polygon points="160,150 155,135 165,145"/>
  <polygon points="180,145 175,130 185,140"/>
  <polygon points="200,145 195,130 205,140"/>
</svg>