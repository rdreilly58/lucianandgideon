<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" fill="none" stroke="black" stroke-width="2.5">
  <!-- Flying Robot with jetpack -->
  <circle cx="250" cy="50" r="6"/>
  <line x1="250" y1="56" x2="250" y2="70" stroke-width="2"/>
  <rect x="210" y="70" width="80" height="65" rx="8" stroke-width="3"/>
  <rect x="230" y="90" width="18" height="15" rx="2"/>
  <rect x="252" y="90" width="18" height="15" rx="2"/>
  <circle cx="239" cy="97" r="3" fill="black"/>
  <circle cx="261" cy="97" r="3" fill="black"/>
  <rect x="230" y="115" width="40" height="8" rx="2"/>
  <!-- Jetpack on back -->
  <rect x="195" y="85" width="15" height="40" rx="3" stroke-width="2"/>
  <rect x="290" y="85" width="15" height="40" rx="3" stroke-width="2"/>
  <!-- Fire/thrust from jetpack -->
  <path d="M 202 125 L 200 145 L 205 135 L 202 150" stroke-width="2" stroke="orange"/>
  <path d="M 297 125 L 295 145 L 300 135 L 297 150" stroke-width="2" stroke="orange"/>
  <!-- Body -->
  <rect x="200" y="135" width="100" height="80" rx="5" stroke-width="3"/>
  <circle cx="235" cy="165" r="10"/>
  <circle cx="265" cy="165" r="10"/>
  <!-- Arms pointing -->
  <rect x="150" y="145" width="45" height="15" rx="3" stroke-width="2" transform="rotate(-20 172 152)"/>
  <rect x="305" y="145" width="45" height="15" rx="3" stroke-width="2" transform="rotate(20 327 152)"/>
  <circle cx="155" cy="160" r="10"/>
  <circle cx="345" cy="160" r="10"/>
  <!-- Legs -->
  <rect x="215" y="215" width="25" height="60" rx="5" stroke-width="3"/>
  <rect x="260" y="215" width="25" height="60" rx="5" stroke-width="3"/>
  <rect x="210" y="275" width="30" height="10" rx="3" stroke-width="2"/>
  <rect x="260" y="275" width="30" height="10" rx="3" stroke-width="2"/>
</svg>
