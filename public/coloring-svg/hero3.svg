<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" fill="none" stroke="black" stroke-width="2.5">
  <!-- Web-shooting Hero -->
  <circle cx="250" cy="85" r="30" stroke-width="3"/>
  <!-- Mask with web pattern -->
  <path d="M 220 75 L 280 75" stroke-width="2"/>
  <path d="M 225 85 L 275 85" stroke-width="1.5"/>
  <path d="M 230 95 L 270 95" stroke-width="1.5"/>
  <ellipse cx="235" cy="83" rx="8" ry="12"/>
  <ellipse cx="265" cy="83" rx="8" ry="12"/>
  <!-- Body with spider emblem -->
  <rect x="225" y="115" width="50" height="70" rx="8" stroke-width="3"/>
  <path d="M 250 135 L 245 145 L 235 150 M 250 135 L 255 145 L 265 150 M 250 135 L 250 160 M 245 145 L 240 160 M 255 145 L 260 160" stroke-width="2"/>
  <!-- Arms in web-shooting pose -->
  <path d="M 225 125 Q 200 130, 180 145" stroke-width="10" stroke-linecap="round"/>
  <ellipse cx="175" cy="150" rx="12" ry="10"/>
  <line x1="175" y1="150" x2="165" y2="148" stroke-width="2"/>
  <line x1="175" y1="150" x2="168" y2="154" stroke-width="2"/>
  <!-- Web coming out -->
  <path d="M 165 148 Q 140 140, 120 135" stroke-width="2" stroke-dasharray="3,3"/>
  <path d="M 168 154 Q 145 160, 125 165" stroke-width="2" stroke-dasharray="3,3"/>
  <path d="M 275 125 Q 305 135, 330 150" stroke-width="10" stroke-linecap="round"/>
  <ellipse cx="335" cy="155" rx="12" ry="10"/>
  <!-- Legs in crouch -->
  <path d="M 235 185 Q 225 220, 210 250" stroke-width="12" stroke-linecap="round"/>
  <path d="M 265 185 Q 275 220, 290 250" stroke-width="12" stroke-linecap="round"/>
  <ellipse cx="210" cy="260" rx="15" ry="12"/>
  <ellipse cx="290" cy="260" rx="15" ry="12"/>
</svg>
