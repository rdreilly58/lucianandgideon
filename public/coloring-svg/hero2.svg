<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" fill="none" stroke="black" stroke-width="2.5">
  <!-- Flying Hero -->
  <circle cx="250" cy="90" r="32" stroke-width="3"/>
  <path d="M 225 70 Q 235 60, 250 65 Q 265 60, 275 70" stroke-width="2"/>
  <ellipse cx="240" cy="88" rx="7" ry="9"/>
  <ellipse cx="260" cy="88" rx="7" ry="9"/>
  <ellipse cx="242" cy="88" rx="3" ry="4" fill="black"/>
  <ellipse cx="262" cy="88" rx="3" ry="4" fill="black"/>
  <!-- Cape flowing -->
  <path d="M 230 120 Q 190 160, 180 240 Q 175 300, 200 350" stroke-width="3"/>
  <path d="M 270 120 Q 310 160, 320 240 Q 325 300, 300 350" stroke-width="3"/>
  <!-- Body in flight -->
  <rect x="230" y="118" width="40" height="60" rx="8" stroke-width="3"/>
  <circle cx="250" cy="140" r="18"/>
  <path d="M 235 140 L 242 148" stroke-width="2"/>
  <path d="M 265 140 L 258 148" stroke-width="2"/>
  <rect x="235" y="165" width="30" height="8"/>
  <!-- Arms extended forward -->
  <rect x="270" y="125" width="50" height="12" rx="6" stroke-width="3"/>
  <ellipse cx="320" cy="131" rx="12" ry="10"/>
  <rect x="180" y="125" width="50" height="12" rx="6" stroke-width="3"/>
  <ellipse cx="180" cy="131" rx="12" ry="10"/>
  <!-- Legs together -->
  <rect x="238" y="178" width="12" height="50" rx="4" stroke-width="3"/>
  <rect x="250" y="178" width="12" height="50" rx="4" stroke-width="3"/>
  <rect x="233" y="228" width="17" height="12" rx="3"/>
  <rect x="250" y="228" width="17" height="12" rx="3"/>
  <!-- Motion lines -->
  <line x1="150" y1="100" x2="180" y2="105" stroke-width="2" stroke-dasharray="5,5"/>
  <line x1="145" y1="120" x2="175" y2="125" stroke-width="2" stroke-dasharray="5,5"/>
</svg>
