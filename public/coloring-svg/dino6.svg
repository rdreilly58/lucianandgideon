<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" fill="none" stroke="black" stroke-width="2.5">
  <!-- Pterodactyl - flying -->
  <text x="50" y="40" font-size="18" font-weight="bold" fill="black" stroke="none">Flying!</text>
  <!-- Body -->
  <ellipse cx="250" cy="150" rx="40" ry="30" stroke-width="3"/>
  <!-- Head with crest -->
  <ellipse cx="295" cy="135" rx="28" ry="25" stroke-width="3"/>
  <path d="M 310 120 L 325 110 L 320 135 Z" stroke-width="2.5"/>
  <!-- Eye -->
  <circle cx="305" cy="130" r="6"/>
  <circle cx="307" cy="128" r="3" fill="black"/>
  <!-- Beak -->
  <path d="M 315 140 L 335 145 L 330 150 Z" stroke-width="2.5"/>
  <!-- Wings spread -->
  <path d="M 240 145 Q 180 120, 120 130 Q 100 135, 90 145" stroke-width="3"/>
  <path d="M 260 145 Q 320 120, 380 130 Q 400 135, 410 145" stroke-width="3"/>
  <!-- Wing details -->
  <line x1="200" y1="135" x2="185" y2="155" stroke-width="2"/>
  <line x1="170" y1="132" x2="155" y2="150" stroke-width="2"/>
  <line x1="140" y1="133" x2="125" y2="155" stroke-width="2"/>
  <line x1="300" y1="135" x2="315" y2="155" stroke-width="2"/>
  <line x1="330" y1="132" x2="345" y2="150" stroke-width="2"/>
  <line x1="360" y1="133" x2="375" y2="155" stroke-width="2"/>
  <!-- Feet -->
  <path d="M 245 175 L 240 200 L 235 210" stroke-width="2.5"/>
  <path d="M 255 175 L 260 200 L 265 210" stroke-width="2.5"/>
  <line x1="235" y1="210" x2="230" y2="215" stroke-width="2"/>
  <line x1="235" y1="210" x2="240" y2="215" stroke-width="2"/>
</svg>
