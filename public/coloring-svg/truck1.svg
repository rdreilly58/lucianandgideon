<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" fill="none" stroke="black" stroke-width="2.5">
  <!-- Flames on side -->
  <path d="M 80 150 Q 70 140, 75 130 Q 80 135, 85 130 Q 90 140, 80 150 Z" fill="none"/>
  <path d="M 90 160 Q 80 150, 85 140 Q 90 145, 95 140 Q 100 150, 90 160 Z" fill="none"/>
  
  <!-- Main truck body -->
  <rect x="120" y="140" width="260" height="80" rx="8" stroke-width="3"/>
  
  <!-- Truck cab with windows -->
  <polygon points="200,140 200,80 300,80 320,110 320,140" stroke-width="3"/>
  <rect x="210" y="90" width="35" height="40" rx="4"/>
  <rect x="255" y="90" width="50" height="40" rx="4"/>
  <line x1="232" y1="90" x2="232" y2="130"/>
  <line x1="282" y1="90" x2="282" y2="130"/>
  
  <!-- Door details -->
  <circle cx="228" cy="110" r="3" fill="black"/>
  
  <!-- Front grille -->
  <rect x="105" y="155" width="18" height="50" rx="2"/>
  <line x1="107" y1="165" x2="121" y2="165"/>
  <line x1="107" y1="175" x2="121" y2="175"/>
  <line x1="107" y1="185" x2="121" y2="185"/>
  <line x1="107" y1="195" x2="121" y2="195"/>
  
  <!-- Back details -->
  <rect x="377" y="155" width="18" height="50" rx="2"/>
  
  <!-- Exhaust pipes -->
  <rect x="340" y="125" width="8" height="15" rx="1"/>
  <rect x="352" y="125" width="8" height="15" rx="1"/>
  <circle cx="344" cy="127" r="3"/>
  <circle cx="356" cy="127" r="3"/>
  
  <!-- Headlights -->
  <circle cx="112" cy="170" r="8"/>
  <circle cx="112" cy="190" r="8"/>
  
  <!-- Side details - racing stripes -->
  <rect x="140" y="160" width="200" height="8" rx="2"/>
  <rect x="140" y="185" width="180" height="6" rx="2"/>
  
  <!-- Number plate -->
  <rect x="250" y="195" width="50" height="20" rx="3"/>
  <text x="275" y="210" text-anchor="middle" font-size="14" font-weight="bold" fill="black" stroke="none">88</text>
  
  <!-- Monster wheels -->
  <g id="wheel">
    <circle cx="180" cy="240" r="60" stroke-width="3"/>
    <circle cx="180" cy="240" r="45"/>
    <circle cx="180" cy="240" r="30"/>
    <circle cx="180" cy="240" r="15"/>
    <line x1="180" y1="180" x2="180" y2="300"/>
    <line x1="120" y1="240" x2="240" y2="240"/>
    <line x1="138" y1="198" x2="222" y2="282"/>
    <line x1="222" y1="198" x2="138" y2="282"/>
    <path d="M 160 210 Q 180 220, 200 210" stroke-width="2"/>
    <path d="M 160 270 Q 180 260, 200 270" stroke-width="2"/>
  </g>
  
  <g id="wheel2">
    <circle cx="320" cy="240" r="60" stroke-width="3"/>
    <circle cx="320" cy="240" r="45"/>
    <circle cx="320" cy="240" r="30"/>
    <circle cx="320" cy="240" r="15"/>
    <line x1="320" y1="180" x2="320" y2="300"/>
    <line x1="260" y1="240" x2="380" y2="240"/>
    <line x1="278" y1="198" x2="362" y2="282"/>
    <line x1="362" y1="198" x2="278" y2="282"/>
    <path d="M 300 210 Q 320 220, 340 210" stroke-width="2"/>
    <path d="M 300 270 Q 320 260, 340 270" stroke-width="2"/>
  </g>
  
  <!-- Suspension -->
  <line x1="180" y1="220" x2="180" y2="180" stroke-width="4"/>
  <line x1="320" y1="220" x2="320" y2="180" stroke-width="4"/>
  <rect x="175" y="175" width="10" height="8" rx="1"/>
  <rect x="315" y="175" width="10" height="8" rx="1"/>
  
  <!-- Mud splatter effects -->
  <circle cx="95" cy="280" r="4"/>
  <circle cx="105" cy="295" r="3"/>
  <circle cx="400" cy="285" r="5"/>
  <circle cx="415" cy="275" r="3"/>
</svg>
