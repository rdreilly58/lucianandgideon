<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" fill="none" stroke="black" stroke-width="2.5">
  <!-- Speed Hero - running fast -->
  <circle cx="260" cy="85" r="28" stroke-width="3"/>
  <!-- Lightning bolt on helmet -->
  <path d="M 265 65 L 260 75 L 267 75 L 262 85" stroke-width="3" stroke="yellow" fill="yellow"/>
  <!-- Mask -->
  <ellipse cx="260" cy="82" rx="30" ry="8"/>
  <ellipse cx="250" cy="83" rx="7" ry="9"/>
  <ellipse cx="270" cy="83" rx="7" ry="9"/>
  <!-- Body leaning forward -->
  <rect x="240" y="113" width="45" height="70" rx="8" stroke-width="3" transform="rotate(15 262 148)"/>
  <!-- Speed lightning emblem -->
  <path d="M 260 135 L 255 145 L 262 145 L 257 155" stroke-width="2" transform="rotate(15 260 145)"/>
  <!-- Arms pumping -->
  <path d="M 240 120 Q 210 115, 190 125" stroke-width="10" stroke-linecap="round" transform="rotate(15 240 120)"/>
  <ellipse cx="185" cy="130" rx="12" ry="10" transform="rotate(15 185 130)"/>
  <path d="M 285 125 Q 310 140, 320 165" stroke-width="10" stroke-linecap="round"/>
  <ellipse cx="322" cy="175" rx="12" ry="10"/>
  <!-- Legs in full sprint -->
  <path d="M 245 180 Q 235 220, 210 250" stroke-width="12" stroke-linecap="round"/>
  <ellipse cx="205" cy="260" rx="15" ry="12" transform="rotate(-20 205 260)"/>
  <path d="M 270 185 Q 290 210, 310 225" stroke-width="12" stroke-linecap="round"/>
  <ellipse cx="315" cy="230" rx="15" ry="12" transform="rotate(30 315 230)"/>
  <!-- Motion speed lines -->
  <line x1="150" y1="140" x2="190" y2="145" stroke-width="2" stroke-dasharray="5,5"/>
  <line x1="145" y1="160" x2="185" y2="165" stroke-width="2" stroke-dasharray="5,5"/>
  <line x1="140" y1="180" x2="180" y2="185" stroke-width="2" stroke-dasharray="5,5"/>
  <line x1="135" y1="200" x2="175" y2="205" stroke-width="2" stroke-dasharray="5,5"/>
</svg>
