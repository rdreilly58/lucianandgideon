<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" fill="none" stroke="black" stroke-width="2.5">
  <!-- Superhero with Cape -->
  
  <!-- Cape flowing behind -->
  <path d="M 220 115 Q 180 140, 160 200 Q 150 260, 170 320 L 190 250 Q 200 200, 210 160 Z" stroke-width="3" fill="none"/>
  <path d="M 280 115 Q 320 140, 340 200 Q 350 260, 330 320 L 310 250 Q 300 200, 290 160 Z" stroke-width="3" fill="none"/>
  
  <!-- Cape folds -->
  <path d="M 175 160 Q 185 180, 180 210" stroke-width="1.5"/>
  <path d="M 185 200 Q 190 230, 185 260" stroke-width="1.5"/>
  <path d="M 315 160 Q 305 180, 310 210" stroke-width="1.5"/>
  <path d="M 305 200 Q 300 230, 305 260" stroke-width="1.5"/>
  
  <!-- Head -->
  <circle cx="250" cy="80" r="35" stroke-width="3"/>
  
  <!-- Hair detail -->
  <path d="M 220 55 Q 230 45, 250 50 Q 270 45, 280 55" stroke-width="2"/>
  <path d="M 225 60 Q 235 55, 245 58" stroke-width="1.5"/>
  <path d="M 255 58 Q 265 55, 275 60" stroke-width="1.5"/>
  
  <!-- Mask -->
  <path d="M 215 75 L 225 70 Q 250 68, 275 70 L 285 75" stroke-width="2.5"/>
  <path d="M 225 70 Q 250 65, 275 70" stroke-width="1.5"/>
  
  <!-- Eyes through mask -->
  <ellipse cx="235" cy="78" rx="8" ry="10" stroke-width="2"/>
  <ellipse cx="235" cy="78" rx="4" ry="5" fill="black"/>
  <ellipse cx="265" cy="78" rx="8" ry="10" stroke-width="2"/>
  <ellipse cx="265" cy="78" rx="4" ry="5" fill="black"/>
  
  <!-- Nose and mouth -->
  <path d="M 250 85 L 248 92" stroke-width="2"/>
  <path d="M 242 98 Q 250 100, 258 98" stroke-width="2"/>
  
  <!-- Neck -->
  <rect x="240" y="110" width="20" height="15" rx="3"/>
  
  <!-- Shoulders -->
  <ellipse cx="210" cy="130" rx="20" ry="15" stroke-width="2.5"/>
  <ellipse cx="290" cy="130" rx="20" ry="15" stroke-width="2.5"/>
  
  <!-- Chest/Torso with emblem -->
  <path d="M 220 125 L 215 135 Q 215 200, 220 240 L 250 250 L 280 240 Q 285 200, 285 135 L 280 125 Z" stroke-width="3"/>
  
  <!-- Superhero emblem on chest (star) -->
  <path d="M 250 160 L 257 175 L 273 177 L 262 188 L 265 203 L 250 195 L 235 203 L 238 188 L 227 177 L 243 175 Z" stroke-width="2" fill="none"/>
  
  <!-- Chest muscles definition -->
  <path d="M 230 145 Q 240 150, 250 148" stroke-width="1.5"/>
  <path d="M 250 148 Q 260 150, 270 145" stroke-width="1.5"/>
  <path d="M 235 165 Q 245 170, 250 168" stroke-width="1.5"/>
  <path d="M 250 168 Q 255 170, 265 165" stroke-width="1.5"/>
  
  <!-- Abs -->
  <rect x="240" y="185" width="20" height="12" rx="2"/>
  <rect x="240" y="200" width="20" height="12" rx="2"/>
  <rect x="240" y="215" width="20" height="12" rx="2"/>
  <line x1="250" y1="185" x2="250" y2="227" stroke-width="1.5"/>
  
  <!-- Belt -->
  <rect x="215" y="235" width="70" height="12" rx="2" stroke-width="2.5"/>
  <rect x="243" y="232" width="14" height="18" rx="2" stroke-width="2"/>
  <circle cx="250" cy="241" r="3"/>
  
  <!-- Arms - muscular -->
  <!-- Left arm (flexed) -->
  <path d="M 210 135 Q 195 145, 185 165 L 180 180" stroke-width="10" stroke-linecap="round"/>
  <ellipse cx="185" cy="172" rx="12" ry="8" stroke-width="2"/> <!-- bicep -->
  <path d="M 180 180 Q 175 195, 178 210 L 185 225" stroke-width="9" stroke-linecap="round"/>
  
  <!-- Right arm (extended) -->
  <path d="M 290 135 Q 310 150, 325 175" stroke-width="10" stroke-linecap="round"/>
  <ellipse cx="315" cy="165" rx="12" ry="8" stroke-width="2"/> <!-- bicep -->
  <path d="M 325 175 Q 335 195, 338 220" stroke-width="9" stroke-linecap="round"/>
  
  <!-- Fists/Hands -->
  <ellipse cx="185" cy="232" rx="12" ry="14" stroke-width="2.5"/>
  <line x1="180" y1="228" x2="175" y2="225" stroke-width="2"/>
  <line x1="180" y1="235" x2="175" y2="238" stroke-width="2"/>
  
  <ellipse cx="338" cy="230" rx="12" ry="14" stroke-width="2.5"/>
  <line x1="333" y1="226" x2="328" y2="223" stroke-width="2"/>
  <line x1="333" y1="233" x2="328" y2="236" stroke-width="2"/>
  
  <!-- Utility belt pouches -->
  <rect x="222" y="238" width="12" height="8" rx="1"/>
  <rect x="266" y="238" width="12" height="8" rx="1"/>
  
  <!-- Legs -->
  <path d="M 230 247 L 225 290 L 220 350" stroke-width="12" stroke-linecap="round"/>
  <path d="M 270 247 L 275 290 L 280 350" stroke-width="12" stroke-linecap="round"/>
  
  <!-- Knee details -->
  <ellipse cx="223" cy="310" rx="10" ry="12" stroke-width="2"/>
  <ellipse cx="277" cy="310" rx="10" ry="12" stroke-width="2"/>
  
  <!-- Muscle definition on legs -->
  <path d="M 227 270 Q 232 275, 227 285" stroke-width="1.5"/>
  <path d="M 273 270 Q 268 275, 273 285" stroke-width="1.5"/>
  
  <!-- Boots -->
  <rect x="205" y="345" width="30" height="35" rx="4" stroke-width="3"/>
  <rect x="265" y="345" width="30" height="35" rx="4" stroke-width="3"/>
  
  <!-- Boot details -->
  <rect x="210" y="355" width="20" height="8" rx="2"/>
  <rect x="270" y="355" width="20" height="8" rx="2"/>
  <line x1="220" y1="348" x2="220" y2="378" stroke-width="1.5"/>
  <line x1="280" y1="348" x2="280" y2="378" stroke-width="1.5"/>
  
  <!-- Cape attachment on shoulders -->
  <line x1="215" y1="118" x2="215" y2="125" stroke-width="3"/>
  <line x1="285" y1="118" x2="285" y2="125" stroke-width="3"/>
</svg>
