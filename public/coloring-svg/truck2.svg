<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" fill="none" stroke="black" stroke-width="2.5">
  <!-- Racing Monster Truck with Spoiler -->
  
  <!-- Spoiler -->
  <rect x="90" y="100" width="120" height="8" rx="2" stroke-width="3"/>
  <line x1="110" y1="108" x2="110" y2="130" stroke-width="4"/>
  <line x1="180" y1="108" x2="180" y2="130" stroke-width="4"/>
  
  <!-- Main body - sleeker design -->
  <path d="M 100 130 L 95 145 Q 95 185, 100 200 L 120 205 L 350 205 L 370 200 Q 375 185, 375 145 L 370 130 Z" stroke-width="3"/>
  
  <!-- Hood scoop -->
  <rect x="280" y="115" width="50" height="25" rx="4" stroke-width="2"/>
  <rect x="285" y="120" width="40" height="15" rx="2"/>
  <line x1="295" y1="122" x2="295" y2="133" stroke-width="1"/>
  <line x1="305" y1="122" x2="305" y2="133" stroke-width="1"/>
  <line x1="315" y1="122" x2="315" y2="133" stroke-width="1"/>
  
  <!-- Cab with racing windshield -->
  <polygon points="180,130 180,70 270,70 310,100 320,130" stroke-width="3"/>
  <path d="M 190 80 L 260 80 L 295 105 L 305 120 L 190 120 Z" stroke-width="2"/>
  
  <!-- Racing stripes on windshield -->
  <line x1="210" y1="85" x2="205" y2="115" stroke-width="2"/>
  <line x1="240" y1="82" x2="230" y2="118" stroke-width="2"/>
  
  <!-- Side vents -->
  <rect x="120" y="155" width="40" height="20" rx="3" stroke-width="2"/>
  <line x1="125" y1="160" x2="125" y2="170" stroke-width="1.5"/>
  <line x1="132" y1="160" x2="132" y2="170" stroke-width="1.5"/>
  <line x1="139" y1="160" x2="139" y2="170" stroke-width="1.5"/>
  <line x1="146" y1="160" x2="146" y2="170" stroke-width="1.5"/>
  <line x1="153" y1="160" x2="153" y2="170" stroke-width="1.5"/>
  
  <!-- Door handle -->
  <rect x="195" y="115" width="15" height="5" rx="2"/>
  
  <!-- Racing number -->
  <circle cx="240" cy="165" r="25" stroke-width="3"/>
  <text x="240" y="175" text-anchor="middle" font-size="28" font-weight="bold" fill="black" stroke="none">7</text>
  
  <!-- Front bumper with details -->
  <rect x="85" y="165" width="15" height="35" rx="3" stroke-width="2"/>
  <circle cx="92" cy="175" r="4"/>
  <circle cx="92" cy="190" r="4"/>
  
  <!-- Back bumper -->
  <rect x="370" y="165" width="15" height="35" rx="3" stroke-width="2"/>
  
  <!-- Dual exhaust -->
  <rect x="352" y="120" width="12" height="20" rx="2" stroke-width="2"/>
  <circle cx="358" cy="122" r="4"/>
  <path d="M 354 125 Q 358 128, 362 125" stroke-width="1"/>
  
  <!-- Monster wheels with treads -->
  <g id="frontwheel">
    <circle cx="150" cy="250" r="65" stroke-width="3"/>
    <circle cx="150" cy="250" r="50"/>
    <circle cx="150" cy="250" r="35"/>
    <circle cx="150" cy="250" r="20"/>
    <!-- Treads -->
    <path d="M 100 215 L 95 220" stroke-width="3"/>
    <path d="M 95 230 L 90 235" stroke-width="3"/>
    <path d="M 90 250 L 85 250" stroke-width="3"/>
    <path d="M 95 270 L 90 275" stroke-width="3"/>
    <path d="M 100 285 L 95 290" stroke-width="3"/>
    <path d="M 200 215 L 205 220" stroke-width="3"/>
    <path d="M 205 230 L 210 235" stroke-width="3"/>
    <path d="M 210 250 L 215 250" stroke-width="3"/>
    <path d="M 205 270 L 210 275" stroke-width="3"/>
    <path d="M 200 285 L 205 290" stroke-width="3"/>
    <!-- Spokes -->
    <line x1="150" y1="185" x2="150" y2="315"/>
    <line x1="85" y1="250" x2="215" y2="250"/>
    <line x1="105" y1="205" x2="195" y2="295"/>
    <line x1="195" y1="205" x2="105" y2="295"/>
    <path d="M 125 220 Q 150 230, 175 220" stroke-width="2"/>
    <path d="M 125 280 Q 150 270, 175 280" stroke-width="2"/>
  </g>
  
  <g id="backwheel">
    <circle cx="320" cy="250" r="65" stroke-width="3"/>
    <circle cx="320" cy="250" r="50"/>
    <circle cx="320" cy="250" r="35"/>
    <circle cx="320" cy="250" r="20"/>
    <!-- Treads -->
    <path d="M 270 215 L 265 220" stroke-width="3"/>
    <path d="M 265 230 L 260 235" stroke-width="3"/>
    <path d="M 260 250 L 255 250" stroke-width="3"/>
    <path d="M 265 270 L 260 275" stroke-width="3"/>
    <path d="M 270 285 L 265 290" stroke-width="3"/>
    <path d="M 370 215 L 375 220" stroke-width="3"/>
    <path d="M 375 230 L 380 235" stroke-width="3"/>
    <path d="M 380 250 L 385 250" stroke-width="3"/>
    <path d="M 375 270 L 380 275" stroke-width="3"/>
    <path d="M 370 285 L 375 290" stroke-width="3"/>
    <!-- Spokes -->
    <line x1="320" y1="185" x2="320" y2="315"/>
    <line x1="255" y1="250" x2="385" y2="250"/>
    <line x1="275" y1="205" x2="365" y2="295"/>
    <line x1="365" y1="205" x2="275" y2="295"/>
    <path d="M 295 220 Q 320 230, 345 220" stroke-width="2"/>
    <path d="M 295 280 Q 320 270, 345 280" stroke-width="2"/>
  </g>
  
  <!-- Suspension shocks -->
  <rect x="145" y="185" width="10" height="20" rx="2" stroke-width="2"/>
  <rect x="315" y="185" width="10" height="20" rx="2" stroke-width="2"/>
  <circle cx="150" cy="208" r="5"/>
  <circle cx="320" cy="208" r="5"/>
  
  <!-- Racing decals -->
  <path d="M 110 175 L 140 175 L 145 180 L 140 185 L 110 185 Z" stroke-width="2"/>
  <path d="M 330 175 L 360 175 L 365 180 L 360 185 L 330 185 Z" stroke-width="2"/>
</svg>
