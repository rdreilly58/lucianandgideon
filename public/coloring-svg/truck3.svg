<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" fill="none" stroke="black" stroke-width="2.5">
  <!-- Lifted Pickup Monster Truck -->
  <!-- Truck bed with toolbox -->
  <rect x="100" y="140" width="120" height="65" rx="5" stroke-width="3"/>
  <rect x="110" y="150" width="100" height="15" rx="3" stroke-width="2"/>
  <line x1="120" y1="155" x2="200" y2="155" stroke-width="1.5"/>
  <!-- Bed rails -->
  <line x1="105" y1="145" x2="105" y2="200" stroke-width="2"/>
  <line x1="215" y1="145" x2="215" y2="200" stroke-width="2"/>
  
  <!-- Cab -->
  <rect x="220" y="120" width="160" height="85" rx="8" stroke-width="3"/>
  <!-- Windshield -->
  <polygon points="240,120 240,75 330,75 360,105 360,120" stroke-width="3"/>
  <path d="M 250 85 L 325 85 L 350 110 L 250 110 Z" stroke-width="2"/>
  <!-- Side windows -->
  <rect x="245" y="135" width="40" height="30" rx="3"/>
  <rect x="295" y="135" width="50" height="30" rx="3"/>
  
  <!-- Front grille -->
  <rect x="375" y="150" width="20" height="45" rx="3" stroke-width="3"/>
  <rect x="378" y="158" width="14" height="8" rx="2"/>
  <rect x="378" y="170" width="14" height="8" rx="2"/>
  <rect x="378" y="182" width="14" height="8" rx="2"/>
  
  <!-- Headlights -->
  <circle cx="385" cy="162" r="6"/>
  <circle cx="385" cy="185" r="6"/>
  
  <!-- Roll bar -->
  <rect x="225" y="95" width="6" height="25" rx="2" stroke-width="2"/>
  <rect x="285" y="95" width="6" height="25" rx="2" stroke-width="2"/>
  <rect x="345" y="95" width="6" height="25" rx="2" stroke-width="2"/>
  <rect x="222" y="95" width="126" height="6" rx="2" stroke-width="2"/>
  
  <!-- Off-road lights on roll bar -->
  <circle cx="255" cy="98" r="5"/>
  <circle cx="315" cy="98" r="5"/>
  
  <!-- Massive wheels with off-road treads -->
  <circle cx="160" cy="260" r="70" stroke-width="3"/>
  <circle cx="160" cy="260" r="55"/>
  <circle cx="160" cy="260" r="40"/>
  <circle cx="160" cy="260" r="25"/>
  <circle cx="160" cy="260" r="10"/>
  <!-- Deep treads -->
  <rect x="90" y="255" width="15" height="10" rx="2"/>
  <rect x="95" y="235" width="12" height="10" rx="2"/>
  <rect x="100" y="215" width="10" height="10" rx="2"/>
  <rect x="215" y="255" width="15" height="10" rx="2"/>
  <rect x="213" y="235" width="12" height="10" rx="2"/>
  <rect x="210" y="215" width="10" height="10" rx="2"/>
  
  <circle cx="320" cy="260" r="70" stroke-width="3"/>
  <circle cx="320" cy="260" r="55"/>
  <circle cx="320" cy="260" r="40"/>
  <circle cx="320" cy="260" r="25"/>
  <circle cx="320" cy="260" r="10"/>
  <rect x="250" y="255" width="15" height="10" rx="2"/>
  <rect x="255" y="235" width="12" height="10" rx="2"/>
  <rect x="260" y="215" width="10" height="10" rx="2"/>
  <rect x="375" y="255" width="15" height="10" rx="2"/>
  <rect x="373" y="235" width="12" height="10" rx="2"/>
  <rect x="370" y="215" width="10" height="10" rx="2"/>
  
  <!-- Lift kit/suspension -->
  <line x1="160" y1="190" x2="160" y2="205" stroke-width="6"/>
  <line x1="320" y1="190" x2="320" y2="205" stroke-width="6"/>
  <rect x="155" y="200" width="10" height="10" rx="2"/>
  <rect x="315" y="200" width="10" height="10" rx="2"/>
  
  <!-- Mud flaps -->
  <path d="M 95 240 L 85 255 L 95 260" stroke-width="2"/>
  <path d="M 225 240 L 235 255 L 225 260" stroke-width="2"/>
  <path d="M 255 240 L 245 255 L 255 260" stroke-width="2"/>
  <path d="M 385 240 L 395 255 L 385 260" stroke-width="2"/>
  
  <!-- Side step -->
  <rect x="230" y="205" width="140" height="8" rx="2" stroke-width="2"/>
  
  <!-- Exhaust stack -->
  <rect x="205" y="100" width="12" height="40" rx="2" stroke-width="2"/>
  <ellipse cx="211" cy="100" rx="6" ry="3" stroke-width="2"/>
</svg>
