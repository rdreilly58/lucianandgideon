<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" fill="none" stroke="black" stroke-width="2.5">
  <!-- Jumping Monster Truck - action pose -->
  <text x="50" y="50" font-size="20" font-weight="bold" fill="black" stroke="none">JUMP!</text>
  <!-- Wheels at angle (jumping) -->
  <ellipse cx="140" cy="240" rx="60" ry="45" stroke-width="3" transform="rotate(-15 140 240)"/>
  <ellipse cx="140" cy="240" rx="45" ry="35" transform="rotate(-15 140 240)"/>
  <ellipse cx="340" cy="220" rx="60" ry="50" stroke-width="3" transform="rotate(10 340 220)"/>
  <ellipse cx="340" cy="220" rx="45" ry="38" transform="rotate(10 340 220)"/>
  <!-- Body tilted -->
  <rect x="110" y="130" width="270" height="70" rx="8" stroke-width="3" transform="rotate(-5 245 165)"/>
  <!-- Cab -->
  <polygon points="200,125 205,80 290,75 310,115" stroke-width="3"/>
  <rect x="215" y="90" width="35" height="30" rx="3"/>
  <rect x="260" y="87" width="35" height="30" rx="3"/>
  <!-- Motion lines -->
  <line x1="30" y1="150" x2="80" y2="145" stroke-width="2" stroke-dasharray="5,5"/>
  <line x1="25" y1="170" x2="75" y2="165" stroke-width="2" stroke-dasharray="5,5"/>
  <line x1="20" y1="190" x2="70" y2="185" stroke-width="2" stroke-dasharray="5,5"/>
  <!-- Star burst (impact) -->
  <path d="M 100 280 L 95 270 L 105 275 L 100 265 L 110 272 L 108 262" stroke-width="2"/>
  <circle cx="165" cy="155" r="25" stroke-width="2"/>
  <text x="165" y="165" text-anchor="middle" font-size="24" font-weight="bold" fill="black" stroke="none">1</text>
</svg>
