<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" fill="none" stroke="black" stroke-width="2.5">
  <!-- Triceratops -->
  <ellipse cx="250" cy="240" rx="90" ry="60" stroke-width="3"/>
  <ellipse cx="340" cy="210" rx="45" ry="40" stroke-width="3"/>
  <!-- Frill -->
  <ellipse cx="340" cy="185" rx="65" ry="50" stroke-width="3"/>
  <circle cx="320" cy="165" r="8"/>
  <circle cx="350" cy="160" r="8"/>
  <circle cx="370" cy="175" r="8"/>
  <!-- Face horns -->
  <path d="M 370 200 L 410 190 L 405 205 Z" stroke-width="2.5"/>
  <path d="M 365 215 L 400 220 L 395 230 Z" stroke-width="2.5"/>
  <!-- Nose horn -->
  <path d="M 385 220 L 410 225 L 405 235 Z" stroke-width="2.5"/>
  <!-- Eye -->
  <circle cx="360" cy="205" r="7"/>
  <circle cx="362" cy="203" r="3" fill="black"/>
  <!-- Legs -->
  <rect x="210" y="275" width="25" height="60" rx="5" stroke-width="3"/>
  <rect x="260" y="275" width="25" height="60" rx="5" stroke-width="3"/>
  <rect x="300" y="275" width="25" height="60" rx="5" stroke-width="3"/>
  <rect x="345" y="275" width="25" height="60" rx="5" stroke-width="3"/>
  <!-- Tail -->
  <path d="M 170 230 Q 120 220, 90 200" stroke-width="4"/>
</svg>
