  <circle cx="232" cy="100" r="3" fill="black"/>
  
  <rect x="255" y="90" width="25" height="20" rx="3" stroke-width="2.5"/>
  <rect x="260" y="95" width="15" height="10" rx="2"/>
  <circle cx="267" cy="100" r="3" fill="black"/>
  
  <!-- Mouth grill -->
  <rect x="220" y="120" width="60" height="12" rx="3"/>
  <line x1="230" y1="122" x2="230" y2="130" stroke-width="1"/>
  <line x1="240" y1="122" x2="240" y2="130" stroke-width="1"/>
  <line x1="250" y1="122" x2="250" y2="130" stroke-width="1"/>
  <line x1="260" y1="122" x2="260" y2="130" stroke-width="1"/>
