  <ellipse cx="145" cy="330" r="15" ry="12" stroke-width="2.5"/>
  <line x1="140" y1="335" x2="138" y2="345" stroke-width="2"/>
  <line x1="145" y1="338" x2="145" y2="348" stroke-width="2"/>
  <line x1="150" y1="335" x2="152" y2="345" stroke-width="2"/>
  
  <ellipse cx="355" cy="330" rx="15" ry="12" stroke-width="2.5"/>
  <line x1="350" y1="335" x2="348" y2="345" stroke-width="2"/>
  <line x1="355" y1="338" x2="355" y2="348" stroke-width="2"/>
  <line x1="360" y1="335" x2="362" y2="345" stroke-width="2"/>
  
  <!-- Waist joint -->
  <rect x="210" y="265" width="80" height="12" rx="3" stroke-width="2"/>
  
  <!-- Hip assembly -->
  <rect x="200" y="277" width="100" height="25" rx="5" stroke-width="2.5"/>
  <circle cx="230" cy="289" r="5"/>
  <circle cx="270" cy="289" r="5"/>
  
  <!-- Legs -->
  <rect x="205" y="302" width="35" height="85" rx="5" stroke-width="3"/>
  <rect x="260" y="302" width="35" height="85" rx="5" stroke-width="3"/>
  
  <!-- Leg panels -->
  <rect x="212" y="320" width="20" height="10" rx="2"/>
  <rect x="212" y="345" width="20" height="10" rx="2"/>
  <rect x="267" y="320" width="20" height="10" rx="2"/>
  <rect x="267" y="345" width="20" height="10" rx="2"/>
  
  <!-- Knee joints -->
  <circle cx="222" cy="345" r="8" stroke-width="2"/>
  <circle cx="277" cy="345" r="8" stroke-width="2"/>
  
  <!-- Feet/Boots -->
  <rect x="195" y="387" width="50" height="12" rx="3" stroke-width="2.5"/>
  <rect x="255" y="387" width="50" height="12" rx="3" stroke-width="2.5"/>
  
  <!-- Foot details -->
  <line x1="205" y1="390" x2="235" y2="390" stroke-width="1.5"/>
  <line x1="265" y1="390" x2="295" y2="390" stroke-width="1.5"/>
