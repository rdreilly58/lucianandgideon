  <!-- Control lights/buttons -->
  <circle cx="225" cy="195" r="8" stroke-width="2"/>
  <circle cx="225" cy="195" r="4"/>
  
  <circle cx="275" cy="195" r="8" stroke-width="2"/>
  <circle cx="275" cy="195" r="4"/>
  
  <rect x="215" y="220" width="70" height="4" rx="2"/>
  <rect x="215" y="230" width="70" height="4" rx="2"/>
  <rect x="215" y="240" width="50" height="4" rx="2"/>
  
  <!-- Arc reactor style detail -->
  <circle cx="250" cy="195" r="15" stroke-width="2"/>
  <circle cx="250" cy="195" r="10"/>
  <circle cx="250" cy="195" r="5"/>
  <line x1="250" y1="180" x2="250" y2="210"/>
  <line x1="235" y1="195" x2="265" y2="195"/>
  
