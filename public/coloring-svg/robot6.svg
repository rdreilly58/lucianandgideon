<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" fill="none" stroke="black" stroke-width="2.5">
  <!-- Detailed Robot -->
  
  <!-- Antenna -->
  <line x1="250" y1="60" x2="250" y2="30" stroke-width="3"/>
  <circle cx="250" cy="25" r="6" stroke-width="2"/>
  <circle cx="250" cy="25" r="3"/>
  <line x1="244" y1="23" x2="240" y2="18" stroke-width="1.5"/>
  <line x1="256" y1="23" x2="260" y2="18" stroke-width="1.5"/>
  
  <!-- Head -->
  <rect x="200" y="60" width="100" height="80" rx="8" stroke-width="3"/>
  
